<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oficina do Celular - Ordens de Serviço</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1329">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #0b1329; color: #ffffff; padding: 15px; -webkit-tap-highlight-color: transparent; }
        
        /* TELA DE LOGIN */
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 85vh; }
        .login-card { background: #162238; padding: 30px 20px; border-radius: 16px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header-title { font-size: 22px; font-weight: 800; color: #38bdf8; margin-bottom: 8px; }
        .login-card p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        
        /* HEADER E MÉTRICAS */
        .app-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #1e293b; margin-bottom: 15px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-left h1 { font-size: 18px; color: #ffffff; }
        .header-left p { font-size: 12px; color: #94a3b8; }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .metric-card { background: #162238; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #1e293b; }
        .metric-value { display: block; font-size: 24px; font-weight: 800; color: #38bdf8; }
        .metric-label { font-size: 12px; color: #94a3b8; }

        /* FORMULÁRIO E ENTRADAS */
        input, select, textarea { width: 100%; padding: 14px; margin-top: 6px; margin-bottom: 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #ffffff; font-size: 15px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
        label { font-size: 13px; color: #cbd5e1; font-weight: 600; display: block; text-align: left; }
        
        /* BOTÕES */
        button { cursor: pointer; border: none; font-weight: 700; border-radius: 8px; transition: 0.2s; }
        .btn-dark { width: 100%; background: #38bdf8; color: #0b1329; padding: 14px; font-size: 16px; }
        .btn-main-action { width: 100%; background: #38bdf8; color: #0b1329; padding: 15px; font-size: 16px; margin-bottom: 15px; }
        .btn-logout { background: #ef4444; color: #ffffff; padding: 8px 14px; font-size: 12px; }
        .btn-close { background: transparent; color: #94a3b8; font-size: 20px; float: right; }
        .btn-clear { background: #334155; color: #ffffff; padding: 8px; font-size: 12px; margin-top: 5px; width: 100%; }
        .btn-dark-full { width: 100%; background: #22c55e; color: #ffffff; padding: 16px; font-size: 16px; margin-top: 10px; }
        
        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal-card { background: #162238; padding: 20px; border-radius: 20px 20px 0 0; width: 100%; max-height: 90vh; overflow-y: auto; border-top: 1px solid #334155; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        /* CARDS DE OS */
        .os-card { background: #162238; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #1e293b; text-align: left; }
        .os-card-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; color: #38bdf8; }
        .os-card p { font-size: 13px; color: #cbd5e1; margin-bottom: 5px; }
        .os-card-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-sm { padding: 8px 12px; font-size: 12px; background: #334155; color: #fff; flex: 1; }
        .btn-whatsapp { background: #22c55e; color: #fff; }

        canvas { background: #ffffff; border-radius: 8px; width: 100%; height: 130px; touch-action: none; margin-top: 5px; }
        .legal-disclaimer { font-size: 11px; color: #94a3b8; background: #0f172a; padding: 10px; border-radius: 8px; margin: 10px 0; text-align: justify; }
        .error-text { color: #ef4444; font-size: 13px; margin-top: 10px; }
        .print-only { display: none; }
    </style>
</head>
<body>

    <!-- Tela de Login -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <div class="header-title">📱 Oficina do Celular</div>
            <p>Área de Acesso do Lojista</p>
            <input type="password" id="passwordInput" placeholder="Sua senha de acesso">
            <button class="btn-dark" onclick="validarSenha()">Entrar no Sistema</button>
            <p id="loginError" class="error-text"></p>
        </div>
    </div>

    <!-- App Principal -->
    <div id="appScreen" class="app-container" style="display: none;">
        <header class="app-header">
            <div class="header-left">
                <span style="font-size: 24px;">📱</span>
                <div>
                    <h1>Oficina do Celular</h1>
                    <p>Ordens de serviço</p>
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </header>

        <main class="content">
            <section class="metrics-grid">
                <div class="metric-card">
                    <span class="metric-value" id="countTotal">0</span>
                    <span class="metric-label">Total</span>
                </div>
                <div class="metric-card">
                    <span class="metric-value" id="countAnalise">0</span>
                    <span class="metric-label">Em análise</span>
                </div>
                <div class="metric-card">
                    <span class="metric-value" id="countReparo">0</span>
                    <span class="metric-label">Em reparo</span>
                </div>
                <div class="metric-card">
                    <span class="metric-value" id="countProntos">0</span>
                    <span class="metric-label">Prontos</span>
                </div>
            </section>

            <button class="btn-main-action" onclick="abrirModalOS()">+ Nova ordem de serviço</button>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Buscar cliente, aparelho, imei ou OS..." onkeyup="buscarOS()">
            </div>

            <section id="osList" class="os-list"></section>
        </main>
    </div>

    <!-- Modal Form de Criar OS -->
    <div id="osModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3 style="color:#fff;">Criar Ordem de Serviço</h3>
                <button class="btn-close" onclick="fecharModalOS()">✕</button>
            </div>
            <form id="osForm" onsubmit="salvarOS(event)">
                <label>Nome do Cliente</label>
                <input type="text" id="clientName" placeholder="Ex: João Silva" required>

                <label>WhatsApp (com DDD)</label>
                <input type="tel" id="clientPhone" placeholder="Ex: 11999998888" required>

                <label>Modelo do Aparelho</label>
                <input type="text" id="deviceModel" placeholder="Ex: iPhone 12" required>

                <label>IMEI do Aparelho</label>
                <input type="text" id="deviceIMEI" placeholder="Ex: 354128" required>

                <label>Defeito Relatado</label>
                <input type="text" id="deviceDefect" placeholder="Ex: Tela quebrada" required>

                <label>Observações / Check-in de riscos</label>
                <textarea id="deviceObs" rows="2" placeholder="Ex: Trincas na traseira, lente quebrada..."></textarea>

                <label>Peça Utilizada</label>
                <input type="text" id="usedPart" placeholder="Ex: Tela Incell">

                <label>Custo da Peça (R$)</label>
                <input type="number" step="0.01" id="partCost" placeholder="Ex: 150.00">

                <label>Status</label>
                <select id="serviceStatus" required>
                    <option value="Em orçamento">Em orçamento</option>
                    <option value="Em análise">Em análise</option>
                    <option value="Em reparo">Em reparo</option>
                    <option value="Pronto">Pronto</option>
                </select>

                <label>Valor Cobrado (R$)</label>
                <input type="number" step="0.01" id="servicePrice" placeholder="Ex: 350.00" required>

                <label>Assinatura Digital do Cliente</label>
                <canvas id="signatureCanvas"></canvas>
                <button type="button" class="btn-clear" onclick="limparAssinatura()">Limpar Assinatura</button>

                <div class="legal-disclaimer">
                    ⚠️ <strong>TERMO:</strong> O cliente declara estar ciente do prazo máximo de 90 dias para a retirada do aparelho.
                </div>

                <button type="submit" class="btn-dark-full">Salvar Ordem de Serviço</button>
            </form>
        </div>
    </div>

    <div id="printSection" class="print-only"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('PWA OK'))
                .catch(err => console.log('PWA Off:', err));
        }
    </script>
</body>
</html>
