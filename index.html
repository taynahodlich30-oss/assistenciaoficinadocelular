<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina do Celular - Ordens de Serviço</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Tela de Login -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <div class="header-title">📱 Oficina do Celular</div>
            <p>Área de Acesso do Lojista</p>
            <input type="password" id="passwordInput" placeholder="Sua senha de acesso">
            <button class="btn-dark" onclick="validarSenha()">Entrar no Sistema</button>
            <p id="loginError" class="error-text"></p>
        </div>
    </div>

    <!-- App Principal -->
    <div id="appScreen" class="app-container" style="display: none;">
        
        <!-- Header Escuro -->
        <header class="app-header">
            <div class="header-left">
                <span class="icon">📱</span>
                <div>
                    <h1>Oficina do Celular</h1>
                    <p>Ordens de serviço</p>
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </header>

        <main class="content">
            
            <!-- Cards de Métricas / Contadores -->
            <section class="metrics-grid">
                <div class="metric-card">
                    <span class="metric-value" id="countTotal">0</span>
                    <span class="metric-label">Total</span>
                </div>
                <div class="metric-card">
                    <span class="metric-value" id="countAnalise">0</span>
                    <span class="metric-label">Em análise</span>
                </div>
                <div class="metric-card">
                    <span class="metric-value" id="countReparo">0</span>
                    <span class="metric-label">Em reparo</span>
                </div>
                <div class="metric-card">
                    <span class="metric-value" id="countProntos">0</span>
                    <span class="metric-label">Prontos</span>
                </div>
            </section>

            <!-- Botão Nova OS -->
            <button class="btn-main-action" onclick="abrirModalOS()">+ Nova ordem de serviço</button>

            <!-- Busca -->
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Buscar cliente, aparelho ou OS..." onkeyup="buscarOS()">
            </div>

            <!-- Lista de OS -->
            <section id="osList" class="os-list">
                <!-- Cards renderizados dinamicamente -->
            </section>
        </main>
    </div>

    <!-- Modal Form de Criar OS -->
    <div id="osModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Criar Ordem de Serviço</h3>
                <button class="btn-close" onclick="fecharModalOS()">✕</button>
            </div>
            <form id="osForm" onsubmit="salvarOS(event)">
                <div class="form-group">
                    <label>Nome do Cliente</label>
                    <input type="text" id="clientName" placeholder="Ex: João Silva" required>
                </div>
                <div class="form-group">
                    <label>WhatsApp (com DDD)</label>
                    <input type="tel" id="clientPhone" placeholder="Ex: 11999998888" required>
                </div>
                <div class="form-group">
                    <label>Modelo do Aparelho</label>
                    <input type="text" id="deviceModel" placeholder="Ex: iPhone 12" required>
                </div>
                <div class="form-group">
                    <label>IMEI do Aparelho</label>
                    <input type="text" id="deviceIMEI" placeholder="Ex: 354128091234567" required>
                </div>
                <div class="form-group">
                    <label>Defeito Relatado</label>
                    <input type="text" id="deviceDefect" placeholder="Ex: Tela quebrada" required>
                </div>
                <div class="form-group">
                    <label>Observações / Observação Interna</label>
                    <textarea id="deviceObs" rows="2" placeholder="Ex: Riscos na tampa traseira..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Status</label>
                        <select id="serviceStatus" required>
                            <option value="Em orçamento">Em orçamento</option>
                            <option value="Em análise">Em análise</option>
                            <option value="Em reparo">Em reparo</option>
                            <option value="Pronto">Pronto</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="text" id="servicePrice" placeholder="Ex: 350,00">
                    </div>
                </div>
                <div class="form-group">
                    <label>Fotos de Entrada (Check-in)</label>
                    <input type="file" id="devicePhotos" accept="image/*" multiple onchange="previewImages(event)">
                    <div id="previewContainer" class="preview-container"></div>
                </div>
                <button type="submit" class="btn-dark-full">Salvar e Enviar WhatsApp</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
