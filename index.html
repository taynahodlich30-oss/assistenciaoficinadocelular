<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina do Celular - Gestão Profissional</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Tela de Login -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <div class="brand">
                <span class="icon">📱</span>
                <h1>Oficina do Celular</h1>
            </div>
            <p>Acesso Restrito ao Painel Administrativo</p>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Senha de Acesso">
            </div>
            <button class="btn-primary" onclick="validarSenha()">Entrar no Sistema</button>
            <p id="loginError" class="error-text"></p>
        </div>
    </div>

    <!-- App Principal -->
    <div id="appScreen" class="app-container" style="display: none;">
        
        <!-- Header / Navbar -->
        <header class="navbar">
            <div class="brand">
                <span class="icon">📱</span>
                <h2>Oficina do Celular</h2>
            </div>
            <button class="btn-secondary" onclick="logout()">Sair</button>
        </header>

        <main class="dashboard">
            
            <!-- Barra de Ações Rápidas (Topo) -->
            <section class="actions-bar">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Buscar por Nº da O.S., Cliente ou IMEI..." onkeyup="buscarOS()">
                </div>
                <button class="btn-primary" onclick="abrirModalNovaOS()">+ Criar Nova O.S.</button>
            </section>

            <!-- Lista de Ordens de Serviço -->
            <section class="os-section">
                <h3>Ordens de Serviço Recentes</h3>
                <div id="osList" class="os-grid">
                    <!-- Cards carregados via Javascript -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal para Criar / Editar Nova O.S. -->
    <div id="osModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Nova Ordem de Serviço</h3>
                <button class="btn-close" onclick="fecharModalNovaOS()">✕</button>
            </div>
            
            <form id="osForm" onsubmit="salvarEEnviarOS(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nome do Cliente</label>
                        <input type="text" id="clientName" placeholder="Ex: João Silva" required>
                    </div>
                    <div class="form-group">
                        <label>WhatsApp (com DDD)</label>
                        <input type="tel" id="clientPhone" placeholder="Ex: 11999998888" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Modelo do Aparelho</label>
                        <input type="text" id="deviceModel" placeholder="Ex: iPhone 12 Pro" required>
                    </div>
                    <div class="form-group">
                        <label>IMEI do Aparelho</label>
                        <input type="text" id="deviceIMEI" placeholder="Ex: 356987102548963" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Defeito Relatado / Serviço</label>
                    <textarea id="deviceDefect" rows="3" placeholder="Ex: Tela quebrada, não liga..." required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Status do Serviço</label>
                        <select id="serviceStatus" required>
                            <option value="Em Orçamento">Em Orçamento</option>
                            <option value="Em Análise">Em Análise</option>
                            <option value="Em Manutenção">Em Manutenção</option>
                            <option value="Pronto para Retirada">Pronto para Retirada</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="text" id="servicePrice" placeholder="Ex: 350,00">
                    </div>
                </div>

                <div class="form-group">
                    <label>Fotos de Check-in (Entrada)</label>
                    <input type="file" id="devicePhotos" accept="image/*" multiple onchange="previewImages(event)">
                    <div id="previewContainer" class="preview-container"></div>
                </div>

                <button type="submit" class="btn-success">Salvar O.S. e Notificar Cliente via WhatsApp</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
