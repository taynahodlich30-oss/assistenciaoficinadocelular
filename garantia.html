<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta de garantia | Oficina do Celular</title>
<meta name="theme-color" content="#0e1918">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#163457,#0b1329 55%);color:#f8fafc;font:16px system-ui,-apple-system,sans-serif;padding:24px}main{max-width:520px;margin:7vh auto;background:#162238;border:1px solid #334155;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0005}h1{font-size:24px;color:#38bdf8;margin:0 0 8px}p{line-height:1.5;color:#cbd5e1}label{display:block;margin-top:24px;font-weight:700}input{width:100%;padding:15px;border:1px solid #475569;border-radius:10px;background:#0f172a;color:white;font-size:15px;margin:8px 0 12px}button{width:100%;padding:15px;border:0;border-radius:10px;background:#38bdf8;color:#0b1329;font-size:16px;font-weight:800;cursor:pointer}.card{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:18px;margin-top:18px}.card strong{color:white}.badge{display:inline-block;padding:7px 12px;border-radius:100px;background:#14532d;color:#bbf7d0;font-weight:800}.expired{background:#713f12;color:#fde68a}#message{margin-top:16px}small{color:#94a3b8}
body{background:radial-gradient(circle at 80% 0%,#205d3b,#0d1515 56%);color:#f1faf6}main{background:linear-gradient(145deg,#1f3529,#121e1a);border:1px solid #537b60;box-shadow:0 30px 75px #0008}h1{color:#b9f8cc;display:flex;align-items:center;gap:10px}h1 .ui-icon{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}p,small{color:#b4ccba}input{background:#101e18;border-color:#54705a}input:focus-visible,button:focus-visible{outline:2px solid #a1ffd0;outline-offset:2px}button{background:linear-gradient(145deg,#a2f4bf,#4ad092);color:#10291a;box-shadow:0 5px 0 #1a7150}button:hover{filter:brightness(1.08)}.card{background:#17261e;border-color:#3e654c}.badge{background:#22593a;color:#ccf9d4}
</style>
</head>
<body><main><h1><svg class="ui-icon" aria-hidden="true"><use href="icons.svg#shield"></use></svg> Consulte sua garantia</h1><p>Use o link recebido da oficina ou digite o código de garantia para ver a data de validade.</p><form id="lookup"><label for="code">Código da garantia</label><input id="code" autocomplete="off" spellcheck="false" required maxlength="48" placeholder="Cole aqui o código recebido"><button type="submit">Consultar garantia</button></form><div id="message" role="status" aria-live="polite"></div><small>Esta página mostra apenas informações da garantia. Para dúvidas sobre cobertura, fale com a oficina.</small></main>
