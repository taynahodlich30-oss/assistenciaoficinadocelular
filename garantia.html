<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta de garantia | Oficina do Celular</title>
<meta name="theme-color" content="#0b1329">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#163457,#0b1329 55%);color:#f8fafc;font:16px system-ui,-apple-system,sans-serif;padding:24px}main{max-width:520px;margin:7vh auto;background:#162238;border:1px solid #334155;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0005}h1{font-size:24px;color:#38bdf8;margin:0 0 8px}p{line-height:1.5;color:#cbd5e1}label{display:block;margin-top:24px;font-weight:700}input{width:100%;padding:15px;border:1px solid #475569;border-radius:10px;background:#0f172a;color:white;font-size:15px;margin:8px 0 12px}button{width:100%;padding:15px;border:0;border-radius:10px;background:#38bdf8;color:#0b1329;font-size:16px;font-weight:800;cursor:pointer}.card{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:18px;margin-top:18px}.card strong{color:white}.badge{display:inline-block;padding:7px 12px;border-radius:100px;background:#14532d;color:#bbf7d0;font-weight:800}.expired{background:#713f12;color:#fde68a}#message{margin-top:16px}small{color:#94a3b8}
</style>
</head>
<body><main><h1>🛡️ Consulte sua garantia</h1><p>Use o link recebido da oficina ou digite o código de garantia para ver a data de validade.</p><form id="lookup"><label for="code">Código da garantia</label><input id="code" autocomplete="off" spellcheck="false" required maxlength="48" placeholder="Cole aqui o código recebido"><button type="submit">Consultar garantia</button></form><div id="message" role="status" aria-live="polite"></div><small>Esta página mostra apenas informações da garantia. Para dúvidas sobre cobertura, fale com a oficina.</small></main>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><script src="garantia.js"></script>
</body></html>
